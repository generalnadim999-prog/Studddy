        }

        // Helper function for smooth countdown number animation
        function animateNumber(elementId, startVal, endVal, duration = 1200) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease-out cubic formula for natural deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(startVal - (startVal - endVal) * easeOut);
                element.textContent = current;
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    element.textContent = endVal;
                }
            };
            window.requestAnimationFrame(step);
        }

        function loadStorage() {
            const stored = localStorage.getItem('nadim_study_tracker_data');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed) {
                        if (!parsed.dataVersion || parsed.dataVersion < DATA_VERSION) {
                            parsed.subjects = DEFAULT_SUBJECTS;
                            parsed.dataVersion = DATA_VERSION;
                        } else if (parsed.subjects) {
                            DEFAULT_SUBJECTS.forEach((defSub) => {

                                if (found) {
                                    defSub.chapters = found.chapters || defSub.chapters;

                            parsed.subjects = DEFAULT_SUBJECTS;

                        parsed.user.subtitle = parsed.user.subtitle || 'Start Your Study Soon';
                        appState = parsed;
                        saveStorage();

                } catch(e) { console.error('Data parsing error', e); }

        // --- CHAPTER & SUBJECT PROGRESS CALCULATIONS ---
        function getChapterProgress(ch, subId) {
            if (!ch) return 0;
            const studyAvg = ((ch.study.book || 0) + (ch.study.class || 0) + (ch.study.summary || 0) + (ch.study.notes || 0)) / 4;
            const mcqPct = ch.mcqTarget > 0 ? Math.min(100, (ch.mcqSolved / ch.mcqTarget) * 100) : 0;

            if (subId === 'ban2') {
                return Math.min(100, (studyAvg + mcqPct) / 2);
            }

            const hasSqSegment = !(subId === 'ban1' && ch.origNum >= 31 && ch.origNum <= 32);
            const sqPct = hasSqSegment && ch.sqTarget > 0 ? Math.min(100, (ch.sqSolved / ch.sqTarget) * 100) : 0;
            if (subId === 'ict') {
                return Math.min(100, (studyAvg + mcqPct + sqPct) / 3);
            }

            const cqPct = ch.cqTarget > 0 ? Math.min(100, (ch.cqSolved / ch.cqTarget) * 100) : 0;
            const segmentCount = hasSqSegment ? 4 : 3;
            return Math.min(100, (studyAvg + cqPct + mcqPct + sqPct) / segmentCount);
        }

        function getSubjectProgress(sub) {
            if (!sub.chapters || sub.chapters.length === 0) return 0;
            const sumPct = sub.chapters.reduce((acc, ch) => acc + getChapterProgress(ch, sub.id), 0);
            const rawAvg = sumPct / sub.chapters.length;

            if (sub.id === 'ban2') {
                return rawAvg * 0.30;
            }
            return rawAvg;
        }

        function OverallSSCProgress() {
            let totalEarned = 0;
            appState.subjects.forEach(sub => {
                totalEarned += getSubjectProgress(sub);
            });
            return (totalEarned / 930) * 100;
        }

        function getTotalCompletedChapters() {
            let count = 0;
            appState.subjects.forEach(s => {
                s.chapters.forEach(ch => {
                    if (getChapterProgress(ch, s.id) >= 99.9) count++;
                });
            });
            return count;
        }

        function getTotalCompletedSubjects() {
            return appState.subjects.filter(s => {
                const prog = getSubjectProgress(s);
                return s.id === 'ban2' ? prog >= 29.9 : prog >= 99.9;
            }).length;
        }

        function getDaysRemaining(targetDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(targetDateStr);
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 0 ? diffDays : 0;
        }

            const dayCoords = [
                {x: 10, y: 80},  // Sat
                {x: 55, y: 65},  // Sun
                {x: 100, y: 70}, // Mon

            let areaD = "";

            // Smooth cubic curve through the same weekly points. The visual style
            // remains unchanged; only the line interpolation is smoothed.
            function buildSmoothPath(points) {
                if (!points.length) return '';
                if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
                let d = `M ${points[0].x} ${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i - 1] || points[i];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = points[i + 2] || p2;
                    const cp1x = p1.x + (p2.x - p0.x) / 6;
                    const cp1y = p1.y + (p2.y - p0.y) / 6;
                    const cp2x = p2.x - (p3.x - p1.x) / 6;
                    const cp2y = p2.y - (p3.y - p1.y) / 6;
                    d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;

                return d;

        function setupWeeklySwipe() {
            const card = document.getElementById('weekly-progress-card');
            if (!card) return;

            let startX = 0;
            let startY = 0;

            card.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                if (!e.changedTouches || e.changedTouches.length !== 1) return;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                const threshold = 50;

                if (Math.abs(dx) < threshold || Math.abs(dx) <= Math.abs(dy)) return;
                if (dx > 0) changeWeekOffset(-1);
                else changeWeekOffset(1);
            }, { passive: true });
        }

        function changeWeekOffset(delta) {
            appState.weekOffset = Math.min(0, appState.weekOffset + delta);
            renderDashboard();

            if (chevron) chevron.style.transform = willOpen ? 'rotate(180deg)' : 'rotate(0deg)';

                    if (!s) return;
                    const isActive = s.id === selectedDashSubId;
                    btn.className = `w-full flex items-center gap-2 text-left px-3 py-2 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-sky-50 text-sky-700' : 'text-slate-600 hover:bg-slate-50'}`;
                    const checkIcon = btn.querySelector('.fa-check');
                    if (isActive && !checkIcon) {
                        const icon = document.createElement('i');
                        icon.className = 'fa-solid fa-check text-[10px] ml-auto text-sky-600';
                        btn.appendChild(icon);
                    } else if (!isActive && checkIcon) {
                        checkIcon.remove();
                    }
                });
            }

            renderBuildingChart(subId);
        }

        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('dash-sub-dropdown-wrap');
            const list = document.getElementById('dash-sub-dropdown-list');
            if (wrap && list && !wrap.contains(e.target)) {
                list.classList.add('hidden');
                const chevron = document.getElementById('dash-sub-select-chevron');
                if (chevron) chevron.style.transform = 'rotate(0deg)';
            }
        });

        function setBoardImpMode(mode) {
            currentBoardImpMode = mode;
            const subId = selectedDashSubId || appState.subjects[0].id;
            renderBuildingChart(subId);
        }

        function renderBuildingChart(subId) {
            const container = document.getElementById('building-chart-container');
            if (!container) return;

            const sub = appState.subjects.find(s => s.id === subId);
            if (!sub || !sub.chapters) return;

            const cqBtn = document.getElementById('imp-btn-cq');
            const mcqBtn = document.getElementById('imp-btn-mcq');
            const themeColor = sub.themeColor || '#0284c7';

            if (cqBtn && mcqBtn) {
                if (currentBoardImpMode === 'CQ') {
                    cqBtn.style.backgroundColor = themeColor;
                    cqBtn.style.color = '#ffffff';
                    cqBtn.style.boxShadow = `0 4px 12px ${themeColor}40`;
                    cqBtn.className = "px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200 ring-2 ring-white";

                    mcqBtn.style.backgroundColor = '';
                    mcqBtn.style.color = '';
                    mcqBtn.style.boxShadow = '';
                    mcqBtn.className = "px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200";
                } else {
                    mcqBtn.style.backgroundColor = themeColor;
                    mcqBtn.style.color = '#ffffff';
                    mcqBtn.style.boxShadow = `0 4px 12px ${themeColor}40`;
                    mcqBtn.className = "px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200 ring-2 ring-white";

                    cqBtn.style.backgroundColor = '';
                    cqBtn.style.color = '';
                    cqBtn.style.boxShadow = '';
                    cqBtn.className = "px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            }

            // Check if CQ is disabled for Bangla 2nd or ICT
            if (currentBoardImpMode === 'CQ' && (sub.id === 'ban2' || sub.id === 'ict')) {
                container.innerHTML = `
                    <div class="w-full py-8 flex flex-col items-center justify-center text-center space-y-2">
                        <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold">N/A</span>
                        <p class="text-xs text-slate-500 font-medium">${sub.name}-এ কোনো CQ বোর্ডের প্রশ্ন থাকে না।</p>
                    </div>
                `;
                return;
            }

            let chapters = [...sub.chapters];
            const impKey = currentBoardImpMode === 'CQ' ? 'cqPastCount' : 'mcqPastCount';

            chapters.sort((a, b) => {
                const valA = a[impKey] || 0;
                const valB = b[impKey] || 0;
                if (valB !== valA) {
                    return valB - valA;
                }
                return a.origNum - b.origNum;
            });

            let maxVal = 1;
            chapters.forEach(ch => {
                const val = ch[impKey] || 0;
                if (val > maxVal) maxVal = val;
            });

            let html = '';
            chapters.forEach((ch) => {
                const countVal = ch[impKey] || 0;
                const heightPx = Math.max(18, Math.round((countVal / maxVal) * 115));

                html += `
                    <div class="flex-1 min-w-[24px] flex flex-col items-center gap-1.5 group cursor-pointer" title="${ch.name}: ${countVal} ${currentBoardImpMode}">
                        <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-white border border-slate-200/80 shadow-2xs text-slate-700 opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-all" style="color: ${themeColor}">
                            ${countVal}
                        </span>
                        <div class="w-full max-w-[28px] rounded-t-lg shadow-sm transition-all duration-300 building-bar group-hover:brightness-110 group-hover:scale-y-105" 
                             style="height: ${heightPx}px; background: linear-gradient(to top, ${themeColor}, ${themeColor}dd); box-shadow: 0 4px 10px ${themeColor}30;">
                        </div>
                        <span class="text-[10px] font-bold text-slate-600 group-hover:text-slate-900 transition-colors bg-white/80 px-1 rounded-md border border-slate-100">C${ch.origNum}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- SETTINGS MODAL & QUESTION TARGET SYSTEM ---
        let selectedSettingsSubId = null;
        let selectedSettingsType = 'CQ';
        let selectedTargetType = 'CQ';
        let selectedTargetSubId = null;
        let activeSettingsMainTab = 'general';
        let activeGeneralTab = 'profile';
        let activeSubjectsTab = 'importance';
        let currentSubjectModalType = null; // 'importance' or 'target'

        function openSubjectModalForTab(type) {
            currentSubjectModalType = type;
            const modalList = document.getElementById('subject-modal-list');
            const overlay = document.getElementById('subject-modal-overlay');
            if (!modalList || !overlay) return;

            let activeId = type === 'importance' ? selectedSettingsSubId : selectedTargetSubId;
            let html = '';
            appState.subjects.forEach(s => {
                const isSelected = s.id === activeId;
                html += `
                    <button type="button" onclick="selectSubjectFromModal('${s.id}')" class="w-full flex items-center gap-3 p-2.5 rounded-2xl transition-all border ${isSelected ? 'bg-[#F8B337]/10 border-[#F8B337] text-slate-900 font-bold' : 'bg-slate-50 border-slate-100 text-slate-700 font-medium hover:bg-slate-100'} text-xs text-left">
                        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${s.themeColor};"></span>
                        <span class="flex-1 whitespace-normal leading-snug">${s.name}</span>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-[#F8B337] text-sm flex-shrink-0"></i>' : ''}
                    </button>
                `;
            });
            modalList.innerHTML = html;
            overlay.classList.remove('hidden');
        }

        function closeSubjectModal() {
            const overlay = document.getElementById('subject-modal-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function selectSubjectFromModal(subId) {
            if (currentSubjectModalType === 'importance') selectedSettingsSubId = subId;
            if (currentSubjectModalType === 'target') selectedTargetSubId = subId;
            closeSubjectModal();
            renderSettingsContent();
        }

        function openSettingsModal() {
            if (!selectedSettingsSubId && appState.subjects.length > 0) selectedSettingsSubId = appState.subjects[0].id;
            if (!selectedTargetSubId && appState.subjects.length > 0) selectedTargetSubId = appState.subjects[0].id;
            // Settings always opens on General > Profile.
            activeSettingsMainTab = 'general';
            activeGeneralTab = 'profile';
            renderSettingsContent();
        }

        function renderSettingsContent() {
            const activeImportanceSub = appState.subjects.find(s => s.id === selectedSettingsSubId) || appState.subjects[0];
            const activeTargetSub = appState.subjects.find(s => s.id === selectedTargetSubId) || appState.subjects[0];

            let importanceChaptersHtml = '';
            if (activeImportanceSub) {
                const isImpCQDisabled = selectedSettingsType === 'CQ' && (activeImportanceSub.id === 'ban2' || activeImportanceSub.id === 'ict');
                if (isImpCQDisabled) {
                    importanceChaptersHtml = `<div class="p-6 bg-slate-50 border border-slate-200/80 rounded-2xl text-center space-y-2"><span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold">N/A</span><p class="text-xs text-slate-500 font-medium">${activeImportanceSub.name}-এ কোনো CQ বোর্ডের প্রশ্ন থাকে না।</p></div>`;
                } else {
                    activeImportanceSub.chapters.forEach(ch => {
                        const val = selectedSettingsType === 'CQ' ? (ch.cqPastCount || 0) : (ch.mcqPastCount || 0);
                        importanceChaptersHtml += `<div class="flex items-center justify-between gap-3 p-3 bg-slate-50 border border-slate-200/80 rounded-xl"><span class="text-xs font-bold text-slate-700 leading-snug">${ch.origNum}. ${ch.name}</span><input type="number" value="${val}" min="0" onchange="updateImportanceVal('${activeImportanceSub.id}', '${ch.id}', '${selectedSettingsType}', this.value)" class="w-20 flex-shrink-0 text-center bg-white border border-slate-300 rounded-lg py-2 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-[#F8B337]/40 outline-none"></div>`;
                    });
                }
            }

            let targetChaptersHtml = '';
            if (activeTargetSub) {
                const isTargetCQDisabled = selectedTargetType === 'CQ' && (activeTargetSub.id === 'ban2' || activeTargetSub.id === 'ict');
                const isTargetSQDisabled = selectedTargetType === 'SQ' && activeTargetSub.id === 'ban2';
                if (isTargetCQDisabled || isTargetSQDisabled) {
                    const typeLabel = isTargetCQDisabled ? 'CQ' : 'SQ';
                    targetChaptersHtml = `<div class="p-6 bg-slate-50 border border-slate-200/80 rounded-2xl text-center space-y-2"><span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold">N/A</span><p class="text-xs text-slate-500 font-medium">${activeTargetSub.name}-এ কোনো ${typeLabel} প্রশ্ন থাকে না।</p></div>`;
                } else {
                    activeTargetSub.chapters.forEach(ch => {
                        // Bangla 1st chapters 31-32 have no SQ segment.
                        if (activeTargetSub.id === 'ban1' && selectedTargetType === 'SQ' && ch.origNum >= 31 && ch.origNum <= 32) return;
                        let key = 'cqTarget';
                        if (selectedTargetType === 'MCQ') key = 'mcqTarget';
                        if (selectedTargetType === 'SQ') key = 'sqTarget';
                        const val = ch[key] || 0;
                        targetChaptersHtml += `<div class="flex items-center justify-between gap-3 p-3 bg-slate-50 border border-slate-200/80 rounded-xl"><span class="text-xs font-bold text-slate-700 leading-snug">${ch.origNum}. ${ch.name}</span><input type="number" value="${val}" min="0" onchange="updateTargetVal('${activeTargetSub.id}', '${ch.id}', '${selectedTargetType}', this.value)" class="w-20 flex-shrink-0 text-center bg-white border border-slate-300 rounded-lg py-2 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-[#F8B337]/40 outline-none"></div>`;
                    });
                }
            }

            const bookHtml = appState.subjects.map((sub, idx) => `
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 space-y-3">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold text-white flex-shrink-0" style="background-color:${sub.themeColor}">${idx + 1}</span>
                        <div class="min-w-0"><div class="text-sm font-extrabold text-slate-800 leading-snug">${sub.name}</div><div class="text-[10px] text-slate-400">Book Cover / Google Drive Link</div></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <img src="${getDirectImageUrl(sub.coverUrl)}" onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=180&auto=format&fit=crop&q=80'" class="w-14 h-20 rounded-xl object-cover bg-white border border-slate-200 shadow-sm flex-shrink-0" alt="${sub.name} cover">
                        <input type="text" value="${sub.coverUrl || ''}" onchange="updateBookUrl('${sub.id}', this.value)" placeholder="Google Drive link" class="min-w-0 flex-1 bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-[11px] text-slate-700 outline-none focus:ring-2 focus:ring-[#F8B337]/40">
                    </div>
                </div>
            `).join('');

            const profileUrl = appState.user.profileImageUrl || PROFILE_IMAGE_URL;
            const contentHtml = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-extrabold text-slate-800"><i class="fa-solid fa-gear text-sky-600 mr-2"></i>Settings & Customization</h3>
                        <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-[#F8B337]/15 hover:text-[#F8B337] active:scale-95 transition-all"><i class="fa-solid fa-xmark text-base"></i></button>
                    </div>

                    <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold gap-1">
                        <button onclick="switchSettingsMainTab('general')" class="flex-1 py-2 px-2 text-center rounded-lg transition-all ${activeSettingsMainTab === 'general' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-600'}">GENERAL</button>
                        <button onclick="switchSettingsMainTab('subjects')" class="flex-1 py-2 px-2 text-center rounded-lg transition-all ${activeSettingsMainTab === 'subjects' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-600'}">SUBJECTS</button>
                    </div>

                    ${activeSettingsMainTab === 'general' ? `
                        <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold gap-1">
                            <button onclick="switchGeneralTab('profile')" class="flex-1 py-2 px-2 rounded-lg transition-all ${activeGeneralTab === 'profile' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">Profile</button>
                            <button onclick="switchGeneralTab('exam')" class="flex-1 py-2 px-2 rounded-lg transition-all ${activeGeneralTab === 'exam' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">Exam Dates</button>
                        </div>
                        ${activeGeneralTab === 'profile' ? `
                            <div class="space-y-3">
                                <div class="text-sm font-extrabold text-slate-800">Your Profile</div>
                                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 space-y-3">
                                    <div class="flex items-center gap-3">
                                        <img src="${getDirectImageUrl(profileUrl)}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md ring-2 ring-sky-100" alt="Profile">
                                        <div class="text-[10px] text-slate-500 leading-relaxed">আপনার Profile Picture-এর Google Drive link এখানে replace করুন। Save করলে Welcome Popup এবং Home-এর profile picture আপডেট হবে।</div>
                                    </div>
                                    <input type="text" value="${profileUrl}" onchange="appState.user.profileImageUrl=this.value.trim() || PROFILE_IMAGE_URL; saveStorage();" placeholder="Google Drive / image link" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-700 outline-none focus:ring-2 focus:ring-[#F8B337]/40">
                                </div>
                                <div class="space-y-1"><label class="text-xs font-bold text-slate-700">Your Name</label><input type="text" value="${appState.user.welcomeName || ''}" onchange="appState.user.welcomeName=this.value.trim() || 'NADIM'; saveStorage();" placeholder="NADIM" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-[#F8B337]/40"></div>
                                <div class="space-y-1"><label class="text-xs font-bold text-slate-700">আপনার নাম</label><input type="text" value="${appState.user.name || ''}" onchange="appState.user.name=this.value.trim() || 'নাদিম হোসেন'; saveStorage();" placeholder="নাদিম হোসেন" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-[#F8B337]/40"></div>
                            </div>
                        ` : `
                            <div class="space-y-3">
                                <div class="space-y-1"><label class="text-xs font-bold text-slate-700">Test Exam Date</label><input type="date" value="${appState.dates.testExam}" onchange="appState.dates.testExam=this.value; saveStorage();" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-[#F8B337]/40"></div>
                                <div class="space-y-1"><label class="text-xs font-bold text-slate-700">SSC Exam Date</label><input type="date" value="${appState.dates.sscExam}" onchange="appState.dates.sscExam=this.value; saveStorage();" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-[#F8B337]/40"></div>
                            </div>
                        `}
                    ` : `
                        <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold gap-1">
                            <button onclick="switchSubjectsTab('importance')" class="flex-1 py-2 px-1 rounded-lg transition-all ${activeSubjectsTab === 'importance' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">Board Importance</button>
                            <button onclick="switchSubjectsTab('target')" class="flex-1 py-2 px-1 rounded-lg transition-all ${activeSubjectsTab === 'target' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">Question Targets</button>
                            <button onclick="switchSubjectsTab('book')" class="flex-1 py-2 px-1 rounded-lg transition-all ${activeSubjectsTab === 'book' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">Book</button>
                        </div>

                        ${activeSubjectsTab === 'importance' ? `
                            <div class="space-y-3"><div class="flex gap-2 items-center"><button type="button" onclick="openSubjectModalForTab('importance')" class="flex-1 min-w-0 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-700 hover:bg-slate-100 transition-all flex items-center justify-between"><span class="whitespace-normal text-left leading-snug">${activeImportanceSub.name}</span><i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-1 flex-shrink-0"></i></button><div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold flex-shrink-0"><button onclick="selectedSettingsType='CQ'; renderSettingsContent();" class="px-3 py-1.5 rounded-lg ${selectedSettingsType === 'CQ' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-500'}">CQ</button><button onclick="selectedSettingsType='MCQ'; renderSettingsContent();" class="px-3 py-1.5 rounded-lg ${selectedSettingsType === 'MCQ' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-500'}">MCQ</button></div></div><div class="space-y-2 max-h-[40vh] overflow-y-auto pr-1">${importanceChaptersHtml}</div></div>
                        ` : ''}

                        ${activeSubjectsTab === 'target' ? `
                            <div class="space-y-3"><div class="flex gap-2 items-center"><button type="button" onclick="openSubjectModalForTab('target')" class="flex-1 min-w-0 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-700 hover:bg-slate-100 transition-all flex items-center justify-between"><span class="whitespace-normal text-left leading-snug">${activeTargetSub.name}</span><i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-1 flex-shrink-0"></i></button><div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold flex-shrink-0"><button onclick="selectedTargetType='CQ'; renderSettingsContent();" class="px-2.5 py-1.5 rounded-lg ${selectedTargetType === 'CQ' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-500'}">CQ</button><button onclick="selectedTargetType='MCQ'; renderSettingsContent();" class="px-2.5 py-1.5 rounded-lg ${selectedTargetType === 'MCQ' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-500'}">MCQ</button><button onclick="selectedTargetType='SQ'; renderSettingsContent();" class="px-2.5 py-1.5 rounded-lg ${selectedTargetType === 'SQ' ? 'bg-[#F8B337] text-white shadow-sm' : 'text-slate-500'}">SQ</button></div></div><div class="space-y-2 max-h-[40vh] overflow-y-auto pr-1">${targetChaptersHtml}</div></div>
                        ` : ''}

                        ${activeSubjectsTab === 'book' ? `<div class="space-y-3"><div class="text-sm font-extrabold text-slate-800">Book Covers</div><div class="space-y-3 max-h-[55vh] overflow-y-auto pr-1">${bookHtml}</div></div>` : ''}
                    `}

                    <button onclick="closeModal(); if(appState.activeTab==='home') renderHome(); else renderDashboard();" class="w-full py-3.5 bg-[#F8B337] text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all">Save & Apply Changes</button>
                </div>
            `;
            showModal(contentHtml);
        }

        function switchSettingsMainTab(tab) {
            activeSettingsMainTab = tab;
            renderSettingsContent();
        }

        function switchGeneralTab(tab) {
            activeGeneralTab = tab;
            renderSettingsContent();
        }

        function switchSubjectsTab(tab) {
            activeSubjectsTab = tab;
            renderSettingsContent();
        }

        function updateBookUrl(subId, val) {
            const sub = appState.subjects.find(s => s.id === subId);
            if (sub) {
                sub.coverUrl = val.trim();
                saveStorage();
            }
        }

        function updateImportanceVal(subId, chId, qType, val) {
            const sub = appState.subjects.find(s => s.id === subId);
            const ch = sub?.chapters.find(c => c.id === chId);
            if (ch) {
                const key = qType === 'CQ' ? 'cqPastCount' : 'mcqPastCount';
                ch[key] = Math.max(0, parseInt(val) || 0);
                saveStorage();
            }
        }

        function updateTargetVal(subId, chId, qType, val) {
            const sub = appState.subjects.find(s => s.id === subId);
            const ch = sub?.chapters.find(c => c.id === chId);
            if (ch) {
                let key = 'cqTarget';
                if (qType === 'MCQ') key = 'mcqTarget';
                if (qType === 'SQ') key = 'sqTarget';
                ch[key] = Math.max(0, parseInt(val) || 0);
                saveStorage();
            }
        }

        // --- MODAL UTILITIES ---
        function showModal(contentHtml) {
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            if (modalOverlay && modalContent) {
                modalContent.innerHTML = contentHtml;
                modalOverlay.classList.remove('hidden');
            }
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modal-overlay');
            if (modalOverlay) {
                modalOverlay.classList.add('hidden');
            }
        }

        // Close modal on clicking overlay backdrop
        document.getElementById('modal-overlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') {
                closeModal();
            }
        });

        // Close subject selector popup modal on clicking backdrop
        document.getElementById('subject-modal-overlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'subject-modal-overlay') {
                closeSubjectModal();
            }
        });

        // --- APP INITIALIZATION ON WINDOW LOAD ---
        window.onload = function () {
            loadStorage();

            // Set welcome profile image
            const welcomeImg = document.getElementById('welcome-profile-img');
            if (welcomeImg) {
                welcomeImg.src = getDirectImageUrl(appState.user.profileImageUrl || PROFILE_IMAGE_URL);
            }
            const welcomeName = document.getElementById('welcome-name');
            if (welcomeName) welcomeName.textContent = appState.user.welcomeName || 'NADIM';

            // Initial render of home tab
            renderHome();

            // 1. WELCOME POPUP DURATION EXACTLY 1 SECOND (1000ms)
            setTimeout(() => {
                const popupOverlay = document.getElementById('welcome-popup-overlay');
                if (popupOverlay) {
                    popupOverlay.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        popupOverlay.style.display = 'none';
                    }, 500);
                }
                welcomePopupDismissed = true;

                // Home countdown already starts immediately when Home is rendered.
                if (appState.activeTab !== 'home') {
                    const sscWeeks = Math.floor(getDaysRemaining(appState.dates.sscExam) / 7);
                    const testWeeks = Math.floor(getDaysRemaining(appState.dates.testExam) / 7);
                    animateNumber('dash-ssc-weeks-num', 62, sscWeeks, 1200);
                    animateNumber('dash-test-weeks-num', 42, testWeeks, 1200);
                }
            }, 1000);
        };
    </script>
</body>
</html>
